<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swiss Rail Pulse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Swiss Rail Pulse</h1>
  <p id="status">Loading data..</p>
  <div id ="filters"> </div>
  <div id ="refresh-bar"> 
    <span id ="last-updated">
        <button id ="refresh-btn">Refresh</button>
    </span>
  </div>
  <canvas id="art" width = "800" height = "450"></canvas>
  <div id="legend">
    <span>On time</span>
    <div id="legend-bar"></div>
    <span>5+ min late</span>
</div>
  <table id="data-table">
    <thead>
      <tr>
        <th>Station</th>
        <th>Trains(next 30m)</th>
        <th>Avg Delay (min)</th>
        <th>Lines</th>
      </tr>
    </thead>
    <tbody id="data-body"></tbody>
  </table>
  <div id="detail-panel" class="hidden">
    <button id="close-detail">✕</button>
    <h3 id="detail-title"></h3>
    <ul id="detail-list"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
